spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}   # 서버 시작 시 즉시 암호화되어 DB에 저장됨. 최초 1회만 쓰이고 이후엔 DB 값 사용
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 1209600000   # 14일 (밀리초)
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  notification:
    recipient: ${NOTIFICATION_EMAIL:keepselfz@gmail.com}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}   # 비어있으면 AI 코칭 기능이 "미설정" 상태로 동작 (에러 대신 안내 메시지)
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}   # 카카오 로컬 API(장소 검색)용
  ootd:
    upload-dir: ${OOTD_UPLOAD_DIR:/app/uploads/ootd}   # docker-compose.prod.yml에서 볼륨 마운트한 경로 - 배포로 컨테이너가 갈아끼워져도 사진이 유지됨
