spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kikiwiki
    username: kikiwiki
    password: kikiwiki

  jpa:
    hibernate:
      ddl-auto: update   # 엔티티 클래스를 보고 테이블을 자동 생성/수정. 운영 단계에선 수동 관리로 전환 예정
    show-sql: true        # 실행되는 SQL을 콘솔에 출력 (학습 단계에서 확인용)
    properties:
      hibernate:
        format_sql: true