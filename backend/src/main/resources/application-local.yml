spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kikiwiki
    username: kikiwiki
    password: kikiwiki

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  admin:
    username: keepself
    password: 123452   # 서버 시작 시 즉시 암호화되어 DB에 저장됨. 최초 1회만 쓰이고 이후엔 DB 값 사용
  jwt:
    secret: kikiwiki-local-dev-secret-key-change-this-in-production-1234567890
    expiration-ms: 1209600000   # 14일 (밀리초)
  notification:
    recipient: ${NOTIFICATION_EMAIL:keepselfz@gmail.com}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}   # 비어있으면 AI 코칭 기능이 "미설정" 상태로 동작 (에러 대신 안내 메시지)
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}   # 카카오 로컬 API(장소 검색)용
