spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kikiwiki
    username: kikiwiki
    password: kikiwiki

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  admin:
    username: keepself
    password: 123452   # 서버 시작 시 즉시 암호화되어 DB에 저장됨. 최초 1회만 쓰이고 이후엔 DB 값 사용
  jwt:
    secret: kikiwiki-local-dev-secret-key-change-this-in-production-1234567890
    expiration-ms: 1209600000   # 14일 (밀리초)
