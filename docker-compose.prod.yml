services:
  postgres:
    image: postgres:16
    container_name: kikiwiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kikiwiki
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kikiwiki-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d kikiwiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/keepself/kikiwiki-backend:latest
    container_name: kikiwiki-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/kikiwiki
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-keepselfz@gmail.com}
    ports:
      - "8080:8080"
    mem_limit: 450m

volumes:
  kikiwiki-postgres-data:
